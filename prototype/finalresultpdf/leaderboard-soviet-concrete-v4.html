<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUBAGENT BENCHMARK — SOVIET CONCRETE MONOLITH V4</title>

  <!-- Google Fonts: Noto Serif SC & Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            soviet: {
              bg: '#141619',
              concrete: '#22262b',
              concreteLight: '#323840',
              red: '#cc1100',
              redDark: '#880c00',
              steel: '#8a95a5',
              paper: '#d9d7ce'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'serif'],
            mono: ['"Fira Code"', 'monospace'],
            sans: ['"Noto Sans SC"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    ::selection { background: #cc1100; color: #ffffff; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #141619; }
    ::-webkit-scrollbar-thumb { background: #cc1100; }

    body {
      background-color: #141619;
      color: #d9d7ce;
      font-family: "Noto Serif SC", serif;
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(204, 17, 0, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px;
    }

    /* Soviet Heavy Concrete Block Styles */
    .concrete-block {
      background: #22262b;
      border: 2px solid #3d444f;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    .concrete-block::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: #cc1100;
    }

    .soviet-red-badge {
      background: #cc1100;
      color: #ffffff;
      font-weight: 900;
      letter-spacing: 0.1em;
    }
  </style>
</head>

<body class="p-4 sm:p-8 min-h-screen">

  <!-- Monumental Header -->
  <header class="concrete-block p-8 mb-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
      <div>
        <div class="inline-block soviet-red-badge px-3 py-1 text-xs font-mono mb-2 uppercase">
          [SOVIET BRUTALISM // 混凝土巨构主义模式]
        </div>
        <h1 class="text-4xl sm:text-6xl font-black font-sans tracking-tight text-white uppercase">
          SUBAGENT 基准矩阵
        </h1>
        <p class="font-serif text-xs text-soviet-steel mt-2">
          粗野、严谨、沉重。像大型工业要塞般剥离修饰，展示神经网络自治测量的硬核事实。
        </p>
      </div>

      <!-- Soviet Style Controls -->
      <div class="flex flex-wrap gap-2 text-xs font-mono">
        <button onclick="setSovietView('monolith')" id="sbtn-monolith" class="px-5 py-2.5 bg-soviet-red text-white font-bold tracking-wider">
          🏛️ 巨构大榜 (MONOLITH)
        </button>
        <button onclick="setSovietView('specimen')" id="sbtn-specimen" class="px-5 py-2.5 bg-soviet-concreteLight text-white font-bold tracking-wider border border-soviet-steel/30">
          📜 混凝土档案 (DOSSIER)
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="soviet-main" class="space-y-6">
    <!-- Rendered dynamically by JS -->
  </main>

  <footer class="mt-16 p-6 concrete-block font-mono text-xs text-soviet-steel flex justify-between">
    <div>SOVIET BRUTALISM DESIGN EXPLORATION V4</div>
    <div>AUTONOMOUS SUBAGENT BENCHMARK HARNESS</div>
  </footer>

  <script>
    const MODELS = [
      { name: "grok-4.6 ✦", short: "16/16", long: "16/20", rev: "92.6 ms", critic: "90.0分 (3 GT)", rank: "全能领跑巨构", note: "短任务双 16/16 满分，长任务 16/20 高度完成，Critic 3 GT 全中 0 误报。" },
      { name: "gpt-5.6-sol ✦", short: "16/16", long: "19/20 ★", rev: "8/8 满分", critic: "97.5分 (depth 4)", rank: "长任务自治堡垒", note: "19/20 闭环率最高，Critic 深度达 depth 4，复杂逻辑第一选择。" },
      { name: "muse-spark-1.2 ✦", short: "16/16", long: "17/20", rev: "58.1 ms ★", critic: "90.0分", rank: "极速响应先锋", note: "58.1 ms 刷新全榜最高速记录！长任务达到 17/20。" },
      { name: "ox-openrouter ✦", short: "16/16", long: "14/20", rev: "73.5 ms", critic: "87.0分", rank: "云端稳健标杆", note: "73.5 ms 满档速，短任务 A/B 双胜 res 2/2。" },
      { name: "gemini-3.6-flash ✦", short: "16/16", long: "15/20", rev: "60.1 ms", critic: "98.2分 ★", rank: "盲审逻辑要塞", note: "98.235 分独占 Critic 榜首！133s 全抓 3 GT 且 depth 4。" },
      { name: "deepseek-v4-pro ✦", short: "16/16", long: "15/20", rev: "8/8 满分", critic: "97.5分", rank: "深度漏洞捕手", note: "Critic 97.5 分（3 GT 全中 + depth 4），短任务与 Reviewer 均通过全部测试。" },
      { name: "glm-5.3 ✦", short: "16/16", long: "16/20", rev: "8/8 满分", critic: "88.5分", rank: "结构编码基石", note: "短任务与 Reviewer 均双满分，长任务 16/20。" },
      { name: "qwen3.8-max", short: "16/16", long: "17/20", rev: "112.1 ms", critic: "88.5分", rank: "原始闭环强者", note: "原始长任务 17/20 完成度，体现了深厚的业务边界防护能力。" }
    ];

    let currentSovietView = 'monolith';

    function setSovietView(v) {
      currentSovietView = v;
      document.querySelectorAll('header button').forEach(b => {
        b.className = 'px-5 py-2.5 bg-soviet-concreteLight text-white font-bold tracking-wider border border-soviet-steel/30';
      });
      if (v === 'monolith') document.getElementById('sbtn-monolith').className = 'px-5 py-2.5 bg-soviet-red text-white font-bold tracking-wider';
      if (v === 'specimen') document.getElementById('sbtn-specimen').className = 'px-5 py-2.5 bg-soviet-red text-white font-bold tracking-wider';
      renderSoviet();
    }

    function renderSoviet() {
      const container = document.getElementById('soviet-main');
      if (currentSovietView === 'monolith') {
        let rows = MODELS.map((m, i) => `
          <tr class="border-b border-soviet-steel/20 hover:bg-white/5 font-mono text-xs">
            <td class="p-4 font-bold text-white flex items-center space-x-3">
              <span class="text-soviet-red font-bold text-sm">#0${i+1}</span>
              <span class="text-base">${m.name}</span>
            </td>
            <td class="p-4"><span class="bg-black border border-soviet-steel/40 text-soviet-paper px-2.5 py-1 text-[10px] font-bold">${m.rank}</span></td>
            <td class="p-4 text-emerald-400 font-bold text-sm">${m.short}</td>
            <td class="p-4 text-soviet-paper font-bold text-sm">${m.long}</td>
            <td class="p-4 text-white font-bold">${m.rev}</td>
            <td class="p-4 text-soviet-red font-bold text-sm">${m.critic}</td>
          </tr>
        `).join('');

        container.innerHTML = `
          <div class="concrete-block p-8 space-y-6">
            <div class="flex justify-between items-center border-b border-soviet-steel/30 pb-4">
              <div>
                <h2 class="text-2xl font-bold font-sans text-white">🏛️ 巨构全景大榜 (SOVIET MONOLITH TABLE)</h2>
                <p class="text-xs text-soviet-steel mt-1 font-serif">未加掩饰的客观基准指标呈现</p>
              </div>
              <span class="soviet-red-badge px-3 py-1 text-xs">34 MODELS TESTED</span>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left font-mono">
                <thead class="bg-black/60 text-soviet-paper text-xs uppercase border-b-2 border-soviet-red">
                  <tr>
                    <th class="p-4">模型标识 (MODEL)</th>
                    <th class="p-4">巨构评级 (RANK)</th>
                    <th class="p-4">短任务 (SHORT)</th>
                    <th class="p-4">长任务 (LONG)</th>
                    <th class="p-4">REV 时延 (LATENCY)</th>
                    <th class="p-4">CRITIC 盲审分</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } else if (currentSovietView === 'specimen') {
        let cards = MODELS.map((m, i) => `
          <div class="concrete-block p-6 space-y-4">
            <div class="flex justify-between items-start border-b border-soviet-steel/20 pb-3">
              <div>
                <span class="soviet-red-badge px-2.5 py-0.5 text-[10px]">DOSSIER #${i+1}</span>
                <h3 class="text-xl font-bold text-white font-sans mt-1">${m.name}</h3>
              </div>
              <span class="text-xs font-mono text-soviet-steel">${m.rank}</span>
            </div>
            <p class="font-serif text-xs text-slate-300 leading-relaxed italic border-l-2 border-soviet-red pl-3">“${m.note}”</p>
            <div class="grid grid-cols-4 gap-3 font-mono text-xs pt-2">
              <div class="bg-black/50 p-2.5 border border-white/10">
                <span class="text-slate-500 block text-[10px]">短任务</span>
                <span class="text-white font-bold mt-0.5 block">${m.short}</span>
              </div>
              <div class="bg-black/50 p-2.5 border border-white/10">
                <span class="text-slate-500 block text-[10px]">长任务</span>
                <span class="text-white font-bold mt-0.5 block">${m.long}</span>
              </div>
              <div class="bg-black/50 p-2.5 border border-white/10">
                <span class="text-slate-500 block text-[10px]">Reviewer</span>
                <span class="text-emerald-400 font-bold mt-0.5 block">${m.rev}</span>
              </div>
              <div class="bg-black/50 p-2.5 border border-white/10">
                <span class="text-slate-500 block text-[10px]">Critic</span>
                <span class="text-soviet-red font-bold mt-0.5 block">${m.critic}</span>
              </div>
            </div>
          </div>
        `).join('');

        container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">${cards}</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSoviet();
    });
  </script>
</body>
</html>
