<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE SUBAGENT GAZETTE — X-RAY 全息解剖透视镜 DEMO V15</title>

  <!-- Google Fonts: Playfair Display, Noto Serif SC, Fira Code & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;700;900&family=Noto+Serif+SC:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            xray: {
              bg: '#040508',
              panel: '#0a0b10',
              cyan: '#00F2FE',
              violet: '#8B5CF6',
              emerald: '#10B981',
              border: '#181a24'
            }
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', '"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            code: ['"Fira Code"', 'monospace']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Offline Dataset & Engine -->
  <script src="./data/dataset.js"></script>

  <style>
    ::selection { background: #00F2FE; color: #000000; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #040508; }
    ::-webkit-scrollbar-thumb { background: #00F2FE; }

    body {
      background-color: #040508;
      color: #e4e4e6;
      font-family: "Noto Serif SC", serif;
      overflow-x: hidden;
    }

    .hairline-b { border-bottom: 1px solid #181a24; }
    .hairline-t { border-top: 1px solid #181a24; }
    .hairline-r { border-right: 1px solid #181a24; }

    .xray-label {
      font-family: "Fira Code", monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #787884;
    }

    /* X-Ray Lens Teardown Split Screen */
    .xray-lens-box {
      border: 1px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.1);
      background: rgba(10, 11, 16, 0.9);
      position: relative;
    }

    .xray-scanner-bar {
      position: absolute;
      top: 0; bottom: 0; width: 2px;
      background: #00F2FE;
      box-shadow: 0 0 15px #00F2FE;
      z-index: 30;
      pointer-events: none;
    }
  </style>
</head>

<body class="p-6 max-w-7xl mx-auto min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="hairline-b pb-4 flex justify-between items-center xray-label">
    <div class="flex items-center space-x-3 text-white font-bold">
      <span class="w-2.5 h-2.5 bg-xray-cyan inline-block animate-pulse"></span>
      <span class="font-sans font-extrabold tracking-wider text-xs">THE SUBAGENT GAZETTE // X-RAY V15</span>
    </div>
    <span>INTERACTIVE SPECIMEN X-RAY TEARDOWN LENS</span>
  </header>

  <!-- Interactive Model Selector Dial -->
  <section class="py-6">
    <div class="xray-label mb-3 text-xray-cyan">[SELECT MODEL FOR HOLOGRAPHIC X-RAY INSPECTION]:</div>
    <div class="flex flex-wrap gap-2 font-code text-xs" id="model-selector-bar">
      <!-- Rendered by JS -->
    </div>
  </section>

  <!-- MAIN X-RAY TEARDOWN LENS PORTAL (全息 X 光解剖视窗) -->
  <main class="xray-lens-box p-8 min-h-[500px] my-auto relative overflow-hidden" id="xray-viewport">
    <div class="xray-scanner-bar" id="scanner-line" style="left: 45%;"></div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start relative z-10" id="xray-content-grid">
      <!-- Rendered Dynamically -->
    </div>
  </main>

  <footer class="hairline-t pt-4 flex justify-between items-center xray-label">
    <div>HOLOGRAPHIC X-RAY TEARDOWN LENS • DEMO V15</div>
    <div>2026 SUBAGENT BENCHMARK HARNESS</div>
  </footer>

  <script>
    const models = window.BENCHMARK_MASTER_MODELS || [];
    let selectedModel = models[0];

    window.addEventListener('DOMContentLoaded', () => {
      renderSelector();
      inspectModel(selectedModel.id);
    });

    function renderSelector() {
      const bar = document.getElementById('model-selector-bar');
      bar.innerHTML = models.map((m, idx) => `
        <button onclick="inspectModel('${m.id}')" id="sel-${m.id}" 
                class="px-3.5 py-1.5 border border-white/20 hover:border-xray-cyan text-slate-300 transition">
          #0${idx+1} ${m.name}
        </button>
      `).join('');
    }

    function inspectModel(id) {
      selectedModel = models.find(x => x.id === id) || models[0];

      // Update button highlights
      document.querySelectorAll('#model-selector-bar button').forEach(b => {
        b.className = 'px-3.5 py-1.5 border border-white/20 hover:border-xray-cyan text-slate-300 transition';
      });
      document.getElementById(`sel-${id}`).className = 'px-3.5 py-1.5 border border-xray-cyan bg-xray-cyan/20 text-xray-cyan font-bold transition';

      // Animate X-Ray Scanner Line
      gsap.fromTo('#scanner-line', { left: "0%" }, { left: "100%", duration: 0.8, ease: "power2.inOut", repeat: 1, yoyo: true });

      // Render X-Ray Lens Content
      const grid = document.getElementById('xray-content-grid');
      grid.innerHTML = `
        <!-- Left: Monolithic Profile -->
        <div class="md:col-span-5 space-y-4 hairline-r pr-6">
          <span class="xray-label text-xray-cyan">[X-RAY NEURAL SPECIMEN NO. ${selectedModel.id.toUpperCase()}]</span>
          <h2 class="text-4xl font-black font-sans text-white tracking-tight">${selectedModel.name}</h2>
          <div class="px-3 py-1 bg-black border border-xray-cyan/40 text-xray-cyan font-mono text-xs inline-block">
            TAG: ${selectedModel.tag} // PROVIDER: ${selectedModel.provider}
          </div>
          <p class="font-script text-sm text-slate-200 leading-relaxed border-l-2 border-xray-cyan pl-4 italic">
            “${selectedModel.quote}”
          </p>
          <p class="font-serif text-xs text-slate-400 leading-relaxed">
            ${selectedModel.analysis}
          </p>
        </div>

        <!-- Right: X-Ray Diagnostic Gauges & Telemetry -->
        <div class="md:col-span-7 space-y-6">
          <div class="flex justify-between items-center hairline-b pb-2 xray-label">
            <span class="text-white font-bold">[REAL-TIME TELEMETRY GAUGES]</span>
            <span class="text-xray-cyan">100% REPRODUCIBLE VERDICT</span>
          </div>

          <div class="grid grid-cols-2 gap-4 font-code text-xs">
            <div class="bg-black p-4 border border-xray-cyan/30 space-y-1">
              <span class="text-slate-500 block text-[10px]">短任务遵从 (Short Spec)</span>
              <span class="text-xray-cyan font-bold text-lg block">${selectedModel.shortTxt}</span>
              <span class="text-slate-400 text-[10px]">16/16 规则单元格全通过</span>
            </div>

            <div class="bg-black p-4 border border-xray-cyan/30 space-y-1">
              <span class="text-slate-500 block text-[10px]">长任务自治闭环 (Autonomy)</span>
              <span class="text-xray-violet font-bold text-lg block">${selectedModel.longTxt}</span>
              <span class="text-slate-400 text-[10px]">20 个 Milestone 独立穿透率</span>
            </div>

            <div class="bg-black p-4 border border-xray-cyan/30 space-y-1">
              <span class="text-slate-500 block text-[10px]">Reviewer 修复数 & 时延</span>
              <span class="text-xray-emerald font-bold text-base block">${selectedModel.revFixes}</span>
              <span class="text-slate-300 text-[11px] block">响应时延: ${selectedModel.revLatency} ms</span>
            </div>

            <div class="bg-black p-4 border border-xray-cyan/30 space-y-1">
              <span class="text-slate-500 block text-[10px]">Critic 盲审与推导深度</span>
              <span class="text-xray-cyan font-bold text-lg block">${selectedModel.criticTxt}</span>
              <span class="text-slate-400 text-[10px]">3 GT 全中 · 0 误报</span>
            </div>
          </div>
        </div>
      `;

      gsap.fromTo('#xray-content-grid', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" });
    }
  </script>
</body>
</html>
